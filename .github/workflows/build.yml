name: Build MicUp APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      CORAL_X_KEYSTORE_BASE64: ${{ secrets.CORAL_X_KEYSTORE_BASE64 }}
      CORAL_X_STORE_PASSWORD: ${{ secrets.CORAL_X_STORE_PASSWORD }}
      CORAL_X_KEY_ALIAS: ${{ secrets.CORAL_X_KEY_ALIAS }}
      CORAL_X_KEY_PASSWORD: ${{ secrets.CORAL_X_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode signing keystore
      run: |
        if [ -n "$CORAL_X_KEYSTORE_BASE64" ]; then
          echo "$CORAL_X_KEYSTORE_BASE64" | base64 -d > micup-release.jks
          cat > keystore.properties << 'PROPS_EOF'
        storeFile=micup-release.jks
        storePassword=PLACEHOLDER_STORE_PASS
        keyAlias=PLACEHOLDER_KEY_ALIAS
        keyPassword=PLACEHOLDER_KEY_PASS
        PROPS_EOF
          sed -i "s|PLACEHOLDER_STORE_PASS|$CORAL_X_STORE_PASSWORD|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_ALIAS|$CORAL_X_KEY_ALIAS|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_PASS|$CORAL_X_KEY_PASSWORD|g" keystore.properties
          echo "Keystore decoded"
        else
          echo "No keystore — debug-signed only"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK (arm64-only, minified)
      run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

    - name: Get version info
      id: version
      run: |
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= *//; s/ *//' | tr -d '"')
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME (code: $VERSION_CODE)"

    - name: Rename release APK
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -n "$APK" ]; then
          cp "$APK" "MicUp-v${VERSION_NAME}.apk"
          ls -lh "MicUp-v${VERSION_NAME}.apk"
        else
          echo "ERROR: No release APK found"
          exit 1
        fi

    - name: Delete previous 'latest' release
      run: |
        gh release delete latest --yes --cleanup-tag 2>/dev/null || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish release APK as GitHub Release
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        gh release create latest \
          "MicUp-v${VERSION_NAME}.apk" \
          --title "MicUp v${VERSION_NAME}" \
          --notes "## Download

        Download \`MicUp-v${VERSION_NAME}.apk\` below — it's ~40MB (arm64-only, works on every phone from 2017+).

        **If install fails:** uninstall any previous MicUp first, then install this one. After v2.0.0, all future updates install cleanly without uninstalling.

        Direct APK download — no zip, no extraction needed." \
          --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
