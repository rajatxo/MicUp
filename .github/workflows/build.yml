name: Build MicUp APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      # Rajat uses the same keystore across all his apps — secret names stay
      # the same per the handover doc.
      CORAL_X_KEYSTORE_BASE64: ${{ secrets.CORAL_X_KEYSTORE_BASE64 }}
      CORAL_X_STORE_PASSWORD: ${{ secrets.CORAL_X_STORE_PASSWORD }}
      CORAL_X_KEY_ALIAS: ${{ secrets.CORAL_X_KEY_ALIAS }}
      CORAL_X_KEY_PASSWORD: ${{ secrets.CORAL_X_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode signing keystore
      run: |
        if [ -n "$CORAL_X_KEYSTORE_BASE64" ]; then
          echo "$CORAL_X_KEYSTORE_BASE64" | base64 -d > micup-release.jks
          cat > keystore.properties << 'PROPS_EOF'
        storeFile=micup-release.jks
        storePassword=PLACEHOLDER_STORE_PASS
        keyAlias=PLACEHOLDER_KEY_ALIAS
        keyPassword=PLACEHOLDER_KEY_PASS
        PROPS_EOF
          sed -i "s|PLACEHOLDER_STORE_PASS|$CORAL_X_STORE_PASSWORD|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_ALIAS|$CORAL_X_KEY_ALIAS|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_PASS|$CORAL_X_KEY_PASSWORD|g" keystore.properties
          echo "Keystore decoded"
        else
          echo "No keystore — debug-signed only"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK (per-ABI for smaller downloads)
      run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PabiSplits=true

    - name: Build debug APK (universal, fallback)
      run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PabiSplits=false

    - name: Get version info
      id: version
      run: |
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= *//; s/ *//' | tr -d '"')
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME (code: $VERSION_CODE)"

    - name: List and rename APKs
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        echo "=== All built APKs ==="
        find app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \;
        # Rename each ABI APK with a clear name
        for apk in app/build/outputs/apk/release/*.apk; do
          name=$(basename "$apk")
          if echo "$name" | grep -q "arm64-v8a"; then
            cp "$apk" "MicUp-v${VERSION_NAME}-arm64.apk"
          elif echo "$name" | grep -q "armeabi-v7a"; then
            cp "$apk" "MicUp-v${VERSION_NAME}-armv7.apk"
          elif echo "$name" | grep -q "universal"; then
            cp "$apk" "MicUp-v${VERSION_NAME}-universal.apk"
          fi
        done
        echo "=== Renamed APKs ==="
        ls -lh MicUp-*.apk

    - name: Upload debug APK artifact (fallback)
      uses: actions/upload-artifact@v4
      with:
        name: micup-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Delete previous 'latest' release
      run: |
        gh release delete latest --yes --cleanup-tag 2>/dev/null || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish release APKs as GitHub Release (direct download, no zip)
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        gh release create latest \
          "MicUp-v${VERSION_NAME}-arm64.apk" \
          "MicUp-v${VERSION_NAME}-armv7.apk" \
          "MicUp-v${VERSION_NAME}-universal.apk" \
          --title "MicUp v${VERSION_NAME}" \
          --notes "## Download instructions

        **Most phones (2017+):** download \`MicUp-v${VERSION_NAME}-arm64.apk\` — smallest, fastest.

        **Older phones (32-bit):** download \`MicUp-v${VERSION_NAME}-armv7.apk\`.

        **Not sure / any phone:** download \`MicUp-v${VERSION_NAME}-universal.apk\` — works everywhere but is larger.

        ---
        All APKs are release-signed with Rajat's keystore. If installing over a previous version fails, uninstall the old one first. After v2.0.0, all future updates install cleanly without uninstalling.

        Direct APK download — no zip, no extraction needed." \
          --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
