name: Build MicUp Step 1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      CORAL_X_KEYSTORE_BASE64: ${{ secrets.CORAL_X_KEYSTORE_BASE64 }}
      CORAL_X_STORE_PASSWORD: ${{ secrets.CORAL_X_STORE_PASSWORD }}
      CORAL_X_KEY_ALIAS: ${{ secrets.CORAL_X_KEY_ALIAS }}
      CORAL_X_KEY_PASSWORD: ${{ secrets.CORAL_X_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode signing keystore
      run: |
        if [ -n "$CORAL_X_KEYSTORE_BASE64" ]; then
          echo "$CORAL_X_KEYSTORE_BASE64" | base64 -d > micup-release.jks
          cat > keystore.properties << 'PROPS_EOF'
        storeFile=micup-release.jks
        storePassword=PLACEHOLDER_STORE_PASS
        keyAlias=PLACEHOLDER_KEY_ALIAS
        keyPassword=PLACEHOLDER_KEY_PASS
        PROPS_EOF
          sed -i "s|PLACEHOLDER_STORE_PASS|$CORAL_X_STORE_PASSWORD|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_ALIAS|$CORAL_X_KEY_ALIAS|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_PASS|$CORAL_X_KEY_PASSWORD|g" keystore.properties
          echo "Keystore decoded"
        else
          echo "No keystore — debug-signed only"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Rename release APK
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        cp "$APK" "MicUp-${VERSION_NAME}.apk"
        ls -lh "MicUp-${VERSION_NAME}.apk"

    - name: Delete previous 'latest' release
      run: |
        gh release delete latest --yes --cleanup-tag 2>/dev/null || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish release APK
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        gh release create latest \
          "MicUp-${VERSION_NAME}.apk" \
          --title "MicUp ${VERSION_NAME}" \
          --notes "## Step 1: WebRTC Load Test

        This build ONLY tests whether the WebRTC native library loads on your phone.

        **What to do:**
        1. Install the APK
        2. Open it — you'll see a single screen
        3. It shows either:
           - ✅ 'WebRTC loaded ✓' (Step 1 PASSED)
           - ❌ 'WebRTC FAILED ✗' with the exact error (send me a screenshot)

        **Don't expect anything else** — no rooms, no mic, no UI. Just a load test." \
          --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
